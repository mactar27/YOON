services:
  mysql:
    image: mysql:8.4
    container_name: yoon-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: yoon
      MYSQL_USER: yoon
      MYSQL_PASSWORD: yoon
      TZ: UTC
    ports:
      - "3306:3306"
    volumes:
      - yoon_mysql_data:/var/lib/mysql
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    command: >-
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci

  adminer:
    image: adminer:4
    container_name: yoon-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    ports:
      - "8081:8080"
    depends_on:
      - mysql

volumes:
  yoon_mysql_data:
